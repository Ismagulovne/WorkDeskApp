name: workdesk
description: WorkDesk - управление рабочим временем и отметками
publish_to: 'none'

version: 1.0.0+1

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter

  # UI & Design
  cupertino_icons: ^1.0.2

  # Authentication & Security
  local_auth: ^2.1.0
  flutter_secure_storage: ^9.0.0

  # Cryptography
  crypto: ^3.0.2
  pointycastle: ^3.7.0

  # Database
  sqflite: ^2.3.0
  path: ^1.8.3

  # HTTP & API
  http: ^1.1.0

  # Firebase (if needed for cloud sync)
  firebase_core: ^2.24.0
  firebase_database: ^10.4.0
  firebase_auth: ^4.16.0

  # State Management
  provider: ^6.1.0

  # Utils
  intl: ^0.19.0
  connectivity_plus: ^5.0.0

dev_dependencies:
  flutter_test:
    sdk: flutter

  flutter_lints: ^3.0.0

  # Testing
  mockito: ^3.49.0
  integration_test:
    sdk: flutter

flutter:
  uses-material-design: true

  assets:
    - assets/
    - assets/icons/
    - assets/images/

  fonts:
    - family: Roboto
      fonts:
        - asset: assets/fonts/Roboto-Regular.ttf
        - asset: assets/fonts/Roboto-Bold.ttf
          weight: 700
        - asset: assets/fonts/Roboto-Medium.ttf
          weight: 500
